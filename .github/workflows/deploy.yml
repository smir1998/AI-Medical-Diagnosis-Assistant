# Deploys the Vite SPA to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# NOTE: jekyll-gh-pages.yml in this tree is intentionally inert — this is the
# ONLY workflow allowed to deploy to the github-pages environment.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (lockfile optional)
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (--base=./ for Pages sub-path)
        run: npm run build -- --base=./

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Keep build snapshot for debugging
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist-snapshot
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (workflows only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows

      - name: Detect competing Pages deployers
        run: |
          for wf in .github/workflows/*.yml; do
            [ "$wf" = ".github/workflows/deploy.yml" ] && continue
            if grep -l "environment: github-pages" "$wf" >/dev/null 2>&1 \
               && grep -A3 "^on:" "$wf" | grep -q "push"; then
              echo "::warning::$wf appears to deploy to github-pages on push — two deployers fight for the same environment. Keep only deploy.yml (or the inert jekyll-gh-pages.yml shipped in this repo)."
            fi
          done

      - name: Verify GitHub Pages is enabled
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "404" ]; then
            echo "::error::GitHub Pages is NOT enabled on this repository (Pages API returned 404)."
            echo "::error::Fix: open https://github.com/${{ github.repository }}/settings/pages, set 'Source' to 'GitHub Actions', save — then choose 'Re-run failed jobs' on this workflow run."
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "::error::GitHub Pages API returned unexpected status $status — check repo settings and token permissions."
            exit 1
          fi
          echo "GitHub Pages is enabled (API status ${status}) — deploying."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "### ✅ Deployed to GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Snapshot artifact: **dist-snapshot** (7-day retention)" >> "$GITHUB_STEP_SUMMARY"
