<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MedLens·AI — an educational AI medical diagnosis assistant: patient registrar, symptom-based differential diagnosis, chest X-ray CNN analysis, dermoscopy screening, medical chatbot and automated reports."
    />
    <title>MedLens · AI Medical Diagnosis Assistant</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MedLens · AI Medical Diagnosis Assistant" />
    <meta
      property="og:description"
      content="Deep Learning in Health Care — patient intake, symptom differentials, chest X-ray CNN, dermoscopy screening, NLP desk, auto-reports and a 41-case QA bench."
    />
    <meta property="og:url" content="https://smir1998.github.io/AI-Medical-Diagnosis-Assistant/" />
    <meta
      property="og:image"
      content="https://smir1998.github.io/AI-Medical-Diagnosis-Assistant/og-banner.svg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b2f2c" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%230b2f2c'/%3E%3Cpath d='M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6z' fill='%238fe3cf'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Semantic Engine pulls weights from the HF Hub — warm the connection early -->
    <link rel="preconnect" href="https://huggingface.co" />
    <link rel="preconnect" href="https://cdn-lfs.huggingface.co" />
    <link rel="dns-prefetch" href="https://cdn-lfs-us-1.huggingface.co" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,700;0,800;0,900;1,800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div
        style="position: fixed; inset: 0; display: grid; place-items: center; background: #0b2f2c; color: #f5f1e6; font-family: ui-monospace, Menlo, monospace; padding: 24px; text-align: center"
      >
        <p>MedLens·AI requires JavaScript to run the diagnostic console. Please enable JavaScript and reload.</p>
      </div>
    </noscript>
    <!--
      Boot watchdog — plain JS that runs BEFORE any module loads, in three
      escalating stages:
        stage 0 → dev entry (/src/main.tsx) fails  → retry it once, cache-busted
        stage 1 → retry also fails                 → load the COMPILED bundle
                                                     from /dist/ via the Vite
                                                     manifest (no dev server
                                                     required — static files)
        stage 2 → compiled bundle unreachable      → readable diagnostic
      A dead preview dev-server session therefore self-heals instead of
      producing a blank or error page.
    -->
    <script>
      (function () {
        var style =
          "position:fixed;inset:0;display:grid;place-items:center;background:#0b2f2c;" +
          "font-family:ui-monospace,Menlo,monospace;color:#f5f1e6;padding:24px;";
        var box =
          "max-width:580px;width:100%;border:2px solid #c7463c;background:#07211e;" +
          "padding:28px;box-shadow:8px 8px 0 rgba(0,0,0,0.45);";
        function diag(title, detail) {
          var root = document.getElementById("root");
          if (!root || root.hasChildNodes() || document.querySelector("[data-fatal]")) return;
          root.innerHTML =
            '<div data-fatal style="' + style + '"><div style="' + box + '">' +
            '<div style="font-size:11px;letter-spacing:0.3em;color:#8fe3cf;opacity:0.7;">MEDLENS·AI · BOOT WATCHDOG</div>' +
            '<h1 style="font-size:24px;margin:10px 0 14px;font-family:Arial,sans-serif;">' + title + "</h1>" +
            '<p style="font-size:12px;line-height:1.6;opacity:0.85;word-break:break-word;">' + detail + "</p>" +
            '<button onclick="location.reload(true)" style="margin-top:16px;background:#0e7c72;color:#f5f1e6;border:none;padding:10px 18px;font-family:inherit;font-size:12px;letter-spacing:0.2em;cursor:pointer;">RESTART CONSOLE</button>' +
            "</div></div>";
        }

        var stage = 0;

        /* Stage 2: serve the app from the compiled, static bundle in /dist/. */
        function loadCompiledBundle() {
          fetch("/dist/.vite/manifest.json", { cache: "no-store" })
            .then(function (r) {
              if (!r.ok) throw new Error("manifest " + r.status);
              return r.json();
            })
            .then(function (manifest) {
              /* entry key varies by Vite version ("index.html" vs the source
                 path) — find whichever chunk is flagged isEntry */
              var entry = null;
              for (var key in manifest) {
                if (manifest[key] && manifest[key].isEntry) {
                  entry = manifest[key];
                  break;
                }
              }
              if (!entry || !entry.file) throw new Error("entry missing from manifest");
              (entry.css || []).forEach(function (c) {
                var link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = "/dist/" + c;
                document.head.appendChild(link);
              });
              var s = document.createElement("script");
              s.type = "module";
              s.src = "/dist/" + entry.file;
              document.head.appendChild(s);
            })
            .catch(function (err) {
              diag(
                "The console failed to boot.",
                "Both the live dev modules and the compiled bundle were unreachable (" +
                  (err && err.message ? err.message : "unknown") +
                  "). Close and reopen the preview, or hard-reload (Ctrl/Cmd + Shift + R) to clear a stale cache."
              );
            });
        }

        function appOwnsPage() {
          return (
            window.__MEDLENS_BOOTED__ ||
            document.querySelector("[data-app-mounted]") ||
            document.querySelector("[data-fatal]")
          );
        }

        /* any error escaping before the app mounts escalates the fallback chain */
        window.addEventListener(
          "error",
          function (e) {
            if (appOwnsPage()) return;
            if (stage === 0) {
              stage = 1;
              setTimeout(function () {
                var s = document.createElement("script");
                s.type = "module";
                s.src = "/src/main.tsx?reboot=" + Date.now();
                document.head.appendChild(s);
              }, 900);
              return;
            }
            if (stage === 1) {
              stage = 2;
              loadCompiledBundle();
              return;
            }
            var src = e.target && e.target.src ? " — failed to load " + e.target.src : "";
            diag(
              "The console failed to boot.",
              (e.message || "Unknown error") + src +
                " The dev server and the compiled bundle are both unreachable — close and reopen the preview, or hard-reload (Ctrl/Cmd + Shift + R)."
            );
          },
          true
        );

        /* React 18 surfaces some mount failures as async rejections */
        window.addEventListener("unhandledrejection", function (e) {
          if (appOwnsPage()) return;
          var msg = (e.reason && e.reason.message) || String(e.reason);
          diag("A boot task was rejected.", msg);
        });

        /* boot timeout — if the app never mounted, jump straight to the bundle */
        var graceExtended = false;
        function scheduleBootTimeout(ms) {
          setTimeout(function () {
            if (document.querySelector("[data-app-mounted]") || document.querySelector("[data-fatal]")) return;
            var root = document.getElementById("root");
            if (root && root.hasChildNodes()) return;
            /* retry still in flight → grant it a little more time first */
            if (stage === 1 && !graceExtended) {
              graceExtended = true;
              scheduleBootTimeout(5000);
              return;
            }
            if (stage < 2) {
              stage = 2;
              loadCompiledBundle();
              scheduleBootTimeout(8000);
              return;
            }
            diag(
              "Boot timed out.",
              "The application modules never mounted. Close and reopen the preview, or hard-reload (Ctrl/Cmd + Shift + R) to clear a stale cache. On the deployed site, a fresh build may still be publishing — wait a minute and retry."
            );
          }, ms);
        }
        scheduleBootTimeout(7000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
