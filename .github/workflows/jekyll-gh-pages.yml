# ⚠️ INTENTIONALLY INERT — do not re-enable.
#
# GitHub offered this workflow when Pages was first configured, but this
# repository is a Vite SPA, not a Jekyll site. An active Jekyll deployer:
#   1. fights deploy.yml for the single 'pages' environment (random 409s /
#      cancelled runs), and
#   2. "succeeds" by serving the repo root, where index.html points at
#      /src/main.tsx — a path that is never deployed — so the site renders
#      blank even on green runs.
#
# deploy.yml (Vite build → dist/) is the ONLY Pages deployer.
# This file stays checked in with no push trigger so nothing re-activates it.

name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Superseded by deploy.yml
        run: |
          echo "This Jekyll deployer is intentionally disabled."
          echo "The Vite SPA is deployed by .github/workflows/deploy.yml."
