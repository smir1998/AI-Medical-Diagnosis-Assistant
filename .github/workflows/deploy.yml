# Deploys the Vite SPA to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# NOTE: jekyll-gh-pages.yml in this repo is intentionally inert — this
# workflow is the ONLY Pages deployer (two deployers fight for the
# 'pages' environment and Jekyll serves a broken site).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (lockfile optional)
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (--base=./ for Pages sub-path)
        run: npm run build -- --base=./

      - name: Detect competing Pages deployers
        run: |
          if [ -f .github/workflows/jekyll-gh-pages.yml ] && grep -q "actions/deploy-pages" .github/workflows/jekyll-gh-pages.yml; then
            echo "::warning::A second, ACTIVE Pages deployer (jekyll-gh-pages.yml) was found in this tree. It fights deploy.yml for the 'pages' environment and serves a broken site. Restore the inert version shipped by this repo."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify GitHub Pages is enabled
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "404" ]; then
            echo "::error::GitHub Pages is NOT enabled on this repository (Pages API returned 404)."
            echo "::error::Fix: open https://github.com/${{ github.repository }}/settings/pages, set 'Source' to 'GitHub Actions', save — then choose 'Re-run failed jobs' on this workflow run."
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "::error::GitHub Pages API returned unexpected status $status — check repo settings and token permissions."
            exit 1
          fi
          echo "GitHub Pages is enabled (API status ${status}) — deploying."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
