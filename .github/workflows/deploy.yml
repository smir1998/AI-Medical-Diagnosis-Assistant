# Deploys the Vite SPA to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# NOTE: jekyll-gh-pages.yml in this tree is intentionally inert — this is the
# ONLY workflow allowed to deploy to the github-pages environment.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile optional)
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (--base=./ for Pages sub-path)
        run: npm run build -- --base=./

      # Keep the exact bundle that CI built — download it from the run's
      # "Artifacts" panel when debugging a deployment.
      - name: Upload build snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-snapshot
          path: dist
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (workflow files only, for deployer audit)
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Detect competing Pages deployers
        run: |
          found=0
          for wf in .github/workflows/*.yml; do
            [ "$wf" = ".github/workflows/deploy.yml" ] && continue
            if grep -l "environment: github-pages" "$wf" >/dev/null 2>&1 \
               && grep -A3 "^on:" "$wf" | grep -q "push"; then
              echo "::warning::$wf deploys to github-pages on push — two deployers fight for the same environment. Keep only deploy.yml (the jekyll-gh-pages.yml in this repo is inert by design)."
              found=1
            fi
          done
          [ "$found" = "0" ] && echo "No competing Pages deployers found."

      - name: Verify GitHub Pages is enabled
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "404" ]; then
            echo "::error::GitHub Pages is NOT enabled on this repository (Pages API returned 404)."
            echo "::error::Fix: open https://github.com/${{ github.repository }}/settings/pages, set 'Source' to 'GitHub Actions', save — then choose 'Re-run failed jobs' on this workflow run."
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "::error::GitHub Pages API returned unexpected status $status — check repo settings and token permissions."
            exit 1
          fi
          echo "GitHub Pages is enabled (API status ${status}) — deploying."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish deployment summary
        run: |
          echo "### ✅ Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Live:** ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Bundle snapshot:** available under this run's *Artifacts* → \`dist-snapshot\`" >> "$GITHUB_STEP_SUMMARY"
