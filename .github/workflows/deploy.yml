# Deploys the Vite SPA to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (lockfile optional)
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (--base=./ for Pages sub-path)
        run: npm run build -- --base=./

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Preflight — is Pages enabled?
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" != "200" ]; then
            echo "::error::GitHub Pages is NOT enabled on this repository (API status $status)."
            echo "::error::Open https://github.com/${{ github.repository }}/settings/pages, set Source to 'GitHub Actions', save, and re-run this workflow."
            exit 1
          fi
          echo "Pages is enabled — deploying."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
