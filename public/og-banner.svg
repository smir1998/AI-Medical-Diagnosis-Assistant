<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="MedLens AI — diagnostic console, deep learning in health care">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#8fe3cf" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="gridBig" width="150" height="150" patternUnits="userSpaceOnUse">
      <path d="M150 0H0V150" fill="none" stroke="#8fe3cf" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0b2f2c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#gridBig)"/>

  <!-- ECG trace -->
  <path d="M0 470 L140 470 L180 470 L210 430 L240 510 L270 470 L420 470 L460 450 L500 490 L540 470 L680 470 L720 470 L760 380 L800 540 L840 470 L1000 470 L1040 455 L1080 485 L1200 470"
        fill="none" stroke="#8fe3cf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M0 470 L140 470 L180 470 L210 430 L240 510 L270 470 L420 470 L460 450 L500 490 L540 470 L680 470 L720 470 L760 380 L800 540 L840 470 L1000 470 L1040 455 L1080 485 L1200 470"
        fill="none" stroke="#8fe3cf" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.10"/>

  <!-- medical cross chip -->
  <rect x="80" y="86" width="84" height="84" fill="#0e7c72"/>
  <path d="M110 104h24v22h22v24h-22v22h-24v-22H88v-24h22z" fill="#f5f1e6"/>

  <!-- wordmark -->
  <text x="190" y="146" font-family="Archivo, 'IBM Plex Sans', sans-serif" font-size="64" font-weight="900" fill="#f5f1e6" letter-spacing="-1">MedLens<tspan fill="#8fe3cf">·AI</tspan></text>
  <text x="192" y="186" font-family="'IBM Plex Mono', monospace" font-size="20" fill="#8fe3cf" opacity="0.75" letter-spacing="8">DIAGNOSTIC CONSOLE v3.2</text>

  <!-- headline -->
  <text x="82" y="286" font-family="Archivo, 'IBM Plex Sans', sans-serif" font-size="58" font-weight="800" fill="#f5f1e6">Deep Learning in Health Care</text>
  <text x="82" y="330" font-family="'IBM Plex Mono', monospace" font-size="21" fill="#8fe3cf" opacity="0.8">symptom encoder · chest X-ray CNN · dermoscopy · NLP desk</text>

  <!-- spec chips -->
  <g font-family="'IBM Plex Mono', monospace" font-size="17" letter-spacing="1">
    <rect x="82" y="362" width="196" height="42" fill="none" stroke="#8fe3cf" stroke-opacity="0.4"/>
    <text x="102" y="389" fill="#8fe3cf">41-CASE QA BENCH</text>
    <rect x="298" y="362" width="250" height="42" fill="none" stroke="#8fe3cf" stroke-opacity="0.4"/>
    <text x="318" y="389" fill="#8fe3cf">LIVE SGD · MEASURED</text>
    <rect x="568" y="362" width="230" height="42" fill="none" stroke="#c7463c" stroke-opacity="0.6"/>
    <text x="588" y="389" fill="#e8a49d">EDUCATIONAL USE</text>
  </g>

  <!-- corner brackets -->
  <g stroke="#8fe3cf" stroke-width="3" opacity="0.6" fill="none">
    <path d="M24 60 V24 H60"/>
    <path d="M1140 24 H1176 V60"/>
    <path d="M1176 570 V606 H1140"/>
    <path d="M60 606 H24 V570"/>
  </g>

  <text x="1176" y="590" text-anchor="end" font-family="'IBM Plex Mono', monospace" font-size="16" fill="#f5f1e6" opacity="0.45">smir1998.github.io/AI-Medical-Diagnosis-Assistant</text>
</svg>
